# Seed component catalog for the local price tracker.
# Each entry: canonical key, display label, category, a seed price in EUR (the
# median ASKING price of a working single item, used until the tracker has
# learned enough real comparables), an optional ship_class, and match aliases.
# The scanner overrides `seed` with the median of real single-item listings it
# scrapes once it has enough of them. Realization (asking -> quick-flip) and
# condition haircuts are applied downstream in appraise.py, so seeds are the
# WORKING asking-median, not the already-discounted number.
#
# Levels reflect the mid-2026 regime: the AI/memory supply shock pulled used
# RAM/SSD/GPU/console prices UP versus 2025, not down. Reprice periodically.

# Verifie sur le marche reel le 2026-09 (le proprietaire a demande de croiser):
#   RTX 5070 12Go   neuf 679-929 EUR -> seed occasion releve de 480 a 570
#   Ryzen 7 5700X   occasion 128-181 EUR -> seed 150 confirme
#   DDR4 32Go kit   45-70 EUR -> seed baisse de 85 a 60 (l'envolee 2026 a frappe
#                   la DDR5, pas la DDR4)
#   SSD NVMe 2To    neuf 100-140 EUR Gen4 -> seed 120
# Le NAND et la DRAM ont double en 2026 (penurie liee a l'IA), donc ces lignes
# vieillissent vite: recroiser avant de se fier a une grosse marge sur du
# stockage ou de la memoire.

