  # ---------- blind spots found by `cli gaps` (2026-08-13) ----------
  # Every entry below appeared in real stored ads that the recognizer could not
  # read, so the machine containing it was valued on its remaining parts alone:
  # a "Game PC GTX 1070 / i5-6600K / 16GB" asking 350 came back worth 209,
  # because two of its three parts did not exist as far as the catalog was
  # concerned. The used pool around Lille is mostly 6th-10th gen Intel and
  # GTX 10-series, which is exactly the range the pricebook had skipped, and
  # that is why no PC ever looked worth buying.
  #
  # Desktop parts only. Mobile chips (11800H, 13900HX, 12500H...) are left out
  # deliberately: they appear in laptop ads, and pricing a laptop's mobile GPU
  # at its desktop namesake's value is how a 400 EUR laptop becomes a fake deal.
