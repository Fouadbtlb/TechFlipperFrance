# Les angles morts mesures le 2026-09-29: tablettes (127 000 EUR de stock non
# evaluable, 100% non reconnu), marques de telephone hors Samsung/Apple/Xiaomi,
# et cartes graphiques nues.
#
# Meme methode que pour les telephones: on interroge d'abord le marche entre
# particuliers, puis on seed le carnet sur les medianes relevees. Sans ca, un
# iPad de magasin ne pourrait etre compare qu'au prix d'etiquette d'un magasin.
#
#   python -m techflip.cli ingest config/searches-blindspots.yaml 4
searches:
- name: BS ipad pro
  source: 2ememain
  url: https://www.2ememain.be/lrp/api/search?query=ipad+pro&limit=30&offset=0&sortBy=SORT_INDEX&sortOrder=DECREASING
