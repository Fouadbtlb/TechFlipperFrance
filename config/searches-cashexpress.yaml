# Cash Express: 23 magasins a portee, une recherche par rayon et par pays.
#
# Pourquoi si peu de lignes pour 150 000 articles: Algolia fait un OU a
# l'interieur d'un tableau de facettes, donc tous les magasins proches tiennent
# dans une seule requete. Cash Converters coute 60 appels pour 30 magasins;
# ici c'est 42 pour 23 magasins et un catalogue cinq fois plus gros.
#
# Les magasins retenus sont a moins de 200 km de Lille ou 130 km de Namur.
# LILLE CENTRE est a 1 km, LIEVIN a 29, HORNU a 59 (a cote de Quaregnon) et
# ANDENNE sur la route du week-end.
#
# Le rayon (`shelf` = categories_faceting.label) est la facette utile, pas
# `universe`: "Consoles & Jeux video" contient "jeux", ce qui ferait barrer
# toutes les consoles par le garde-fou des rayons.
