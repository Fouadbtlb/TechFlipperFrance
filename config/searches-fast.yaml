# Jeu de recherches REDUIT, pour le service qui tourne en continu.
#
# Pourquoi: la version complete lance 30 recherches par cycle, dont 22 par
# mots-cles a l'echelle nationale dont la page 1 part a Marseille. Ici, que des
# balayages par rayon autour de Lille: c'est la seule chose qui sert a etre
# premier sur une annonce proche, et ca divise le nombre de requetes par ~4.
#
# Le service tourne aussi avec AI_URL vide: l'inference vision en CPU est ce qui
# chauffe la machine, pas le scan. Sans modele, la verification photo repond
# "non verifiee" et la garde se ferme d'elle-meme (voir pipeline._evaluate):
# une annonce ambigue proche n'alerte plus, une annonce claire alerte avec un
# avertissement "a controler sur place".
default_exclude:
- recherche
- achète
- je cherche
