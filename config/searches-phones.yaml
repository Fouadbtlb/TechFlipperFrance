# Telephones entre particuliers. Le trou le plus cher du carnet de prix.
#
# 2 469 annonces GSM non evaluees, soit 697 000 EUR de stock, parce que le
# marche prive des telephones n'etait jamais interroge: toutes les recherches
# configurees visaient le PC et la console. Resultat, les seules donnees
# telephone du pool venaient des chaines, et une chaine est le plafond de
# vente, pas le prix qu'on en tire (Switch: 170 en magasin, 128 entre
# particuliers). Sans ces lignes, evaluer un telephone de magasin revenait a
# le comparer a son propre prix d'etiquette.
#
# postcode=7700 = Mouscron, a 16 km de Lille et sur la frontiere: le rayon
# attrape les deux marches d'un coup.
#
#   SEARCHES_FILE=config/searches-phones.yaml python -m techflip.cli once
searches:
- name: GSM 40km (BE)
  source: 2ememain
  url: https://www.2ememain.be/lrp/api/search?l1CategoryId=136&postcode=7700&distanceMeters=40000&limit=30&offset=0&sortBy=SORT_INDEX&sortOrder=DECREASING
  kind: hunt
  min_price: 60
  max_price: 1600
- name: GSM 80km (BE)
  source: 2ememain
  url: https://www.2ememain.be/lrp/api/search?l1CategoryId=136&postcode=7700&distanceMeters=80000&limit=30&offset=0&sortBy=SORT_INDEX&sortOrder=DECREASING
