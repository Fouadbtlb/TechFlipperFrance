# Two kinds of search:
#   hunt   -> valued and can alert (near Lille = easy/low bar, far = high bar)
#   feeder -> only teaches the price tracker, never alerts
#
# Distance is handled by the zone logic, not the URL, so hunt searches can stay
# nationwide: near-Lille listings alert on a thin margin, far ones need a big
# net margin after shipping. To hard-limit a search to a radius, paste a
# Leboncoin URL that already has a location filter set.

default_exclude:
  - "recherche"
  - "achète"
  - "je cherche"

searches:
  # ---------- hunt: deals we want alerts on ----------
  - name: "PS5"
    url: "https://www.leboncoin.fr/recherche?category=43&text=ps5"
    kind: hunt
    min_price: 120
    max_price: 600

  - name: "Xbox Series X"
    url: "https://www.leboncoin.fr/recherche?category=43&text=xbox%20series%20x"
    kind: hunt
    min_price: 120
    max_price: 500

  - name: "PC Gamer"
    url: "https://www.leboncoin.fr/recherche?category=15&text=pc%20gamer"
    kind: hunt
    min_price: 150
    max_price: 1500

  - name: "RTX 4070"
    url: "https://www.leboncoin.fr/recherche?category=15&text=rtx%204070"
    kind: hunt
    min_price: 200
    max_price: 800

  - name: "RTX 3060"
    url: "https://www.leboncoin.fr/recherche?category=15&text=rtx%203060"
    kind: hunt
    min_price: 100
    max_price: 400

  - name: "Nintendo Switch"
    url: "https://www.leboncoin.fr/recherche?category=43&text=nintendo%20switch"
    kind: hunt
    min_price: 80
    max_price: 350

  # ---------- feeder: reference prices for the tracker ----------
  - name: "RTX 3070 (ref)"
    url: "https://www.leboncoin.fr/recherche?category=15&text=rtx%203070"
    kind: feeder

  - name: "Ryzen 5 5600 (ref)"
    url: "https://www.leboncoin.fr/recherche?category=15&text=ryzen%205%205600"
    kind: feeder

  - name: "SSD NVMe 1To (ref)"
    url: "https://www.leboncoin.fr/recherche?category=15&text=ssd%20nvme%201to"
    kind: feeder

  - name: "DDR4 16Go (ref)"
    url: "https://www.leboncoin.fr/recherche?category=15&text=ddr4%2016go"
    kind: feeder

  # ---------- 2ememain: balayage large ----------
  # Une requete par modele ne voit que ce qu'on a pense a nommer. Ces requetes
  # larges ramenent tout le rayon et laissent le recognizer identifier le
  # modele, donc un RX 6750 XT ou une carte qu'on n'a jamais cherchee remonte
  # quand meme. Bilingue: le pool belge est moitie FR, moitie NL.
  - name: "Cartes graphiques (large FR)"
    source: 2ememain
    url: "https://www.2ememain.be/lrp/api/search?query=carte%20graphique&limit=30&offset=0&sortBy=SORT_INDEX&sortOrder=DECREASING"
    kind: hunt
    min_price: 60
    max_price: 900
  - name: "Cartes graphiques (large NL)"
    source: 2ememain
    url: "https://www.2ememain.be/lrp/api/search?query=videokaart&limit=30&offset=0&sortBy=SORT_INDEX&sortOrder=DECREASING"
    kind: hunt
    min_price: 60
    max_price: 900
  - name: "Consoles (large FR)"
    source: 2ememain
    url: "https://www.2ememain.be/lrp/api/search?query=console%20de%20jeu&limit=30&offset=0&sortBy=SORT_INDEX&sortOrder=DECREASING"
    kind: hunt
    min_price: 80
    max_price: 700
  - name: "Consoles (large NL)"
    source: 2ememain
    url: "https://www.2ememain.be/lrp/api/search?query=spelcomputer&limit=30&offset=0&sortBy=SORT_INDEX&sortOrder=DECREASING"
    kind: hunt
    min_price: 80
    max_price: 700

  # ---------- 2ememain (Belgique, frontalier Lille) ----------
  - name: "PS5 (2ememain BE)"
    source: 2ememain
    url: "https://www.2ememain.be/lrp/api/search?query=playstation%205&limit=30&offset=0&sortBy=SORT_INDEX&sortOrder=DECREASING"
    kind: hunt
