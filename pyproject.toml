[project]
name = "techflip"
version = "0.1.0"
description = "Personal Leboncoin tech-flip scanner: values a machine by its parts and alerts near-Lille deals via Telegram"
requires-python = ">=3.10"
dependencies = [
    "lbc>=1.1.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pgeocode>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["techflip*"]
