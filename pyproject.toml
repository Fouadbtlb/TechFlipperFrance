[project]
name = "techflip"
version = "1.0.0"
description = "Used-tech flip finder: values a listing by its parts, decides per viewer, serves a paid mobile app"
requires-python = ">=3.10"
dependencies = [
    "lbc>=1.1.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pgeocode>=0.4",
]

[project.optional-dependencies]
# The app backend. The scanner alone runs without any of this.
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "cbor2>=5.6",
    "cryptography>=42",
    "google-auth[requests]>=2.30",
]
dev = ["pytest>=8.0", "techflip[api]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["techflip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
